# initramfs — dùng cho systemd-boot + kernel-install.
#
# `microcode` là hook BẮT BUỘC trên máy Intel: kernel refuse khởi động
# nếu initramfs không nhúng microcode. Gói tương ứng: `intel-ucode`.
#
# Không có `resume` vì máy này không dùng hibernate.

MODULES=()
BINARIES=()
FILES=()

HOOKS=(base udev autodetect microcode keyboard keymap console_font block filesystems fsck)

# Không hoạt động với root đặt trong RAID/LUKS/kiểu này — bỏ nếu không dùng.
# LUKS=()
# SDDM=()
# FWCTL=()
