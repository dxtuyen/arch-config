# keyd — remap phím cứng.
#
#   Caps Lock  : giữ = Ctrl, chạm = Esc
#   Tab        : giữ = Nav (h/j/k/l), chạm = Tab
#   hjkl       : ←↓↑→ (chỉ khi đang giữ Tab — cấu hình `nav` bên dưới)
#
# ⚠️ keyd chạy ở tầng input, KHÔNG phải ở tầng ứng dụng → nhận diện
#    được cả trong TTY lẫn trong Sway.

[main]
capslock = overload(control, esc)
tab = overload(nav, tab)

[nav]
h = left
j = down
k = up
l = right
u = home
i = end
o = pageup
p = pagedown
