# zram-generator — swap nén trong RAM.
# Nhanh hơn swap trên SSD và giảm mòn ổ (chỉ ghi khi thật sự thiếu RAM).
#
# zstd mất nhiều CPU hơn lz4 nhưng nén tốt hơn nhiều → với 8 GB RAM thì
# 4 GB zram đủ chứa cả phần "lạnh" của bộ nhớ.

[zram0]
zram-size = 50%
compression-algorithm = zstd
swap-priority = 100
