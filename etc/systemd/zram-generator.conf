# zram-generator — swap nén trong RAM.
# Nhanh hơn swap trên SSD và giảm mòn ổ: chỉ ghi xuống đĩa khi thật sự
# thiếu RAM, thay vì swap trên ổ ghi liên tục.
#
# zstd tốn nhiều CPU hơn lz4 nhưng nén mạnh hơn nhiều — 50% RAM nén zstd
# chứa được phần "lạnh" của bộ nhớ, tức gần như toàn bộ những gì đang
# ngồi không dùng.
#
# ⚠️ zram KHÔNG thay được swap cho hibernate: nằm trong RAM nên tắt máy
#   là mất, không có gì để `resume=` tìm. Ở đây nó chỉ để giảm áp lực
#   RAM, thay cho việc tạo phân vùng swap.
#
# swap-priority: chỉ có MỘT swap device thì trường này không ảnh hưởng
# gì. Nếu sau này thêm swap trên đĩa, để zram = 10 để kernel ưu tiên
# đĩa (đĩa bền hơn cho dữ liệu lâu dài, RAM thì không).

[zram0]
zram-size = 50%
compression-algorithm = zstd
swap-priority = 100
