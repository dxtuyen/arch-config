# logind — hành vi laptop.
#
# Đóng nắp → ngủ. Gắn dock → bỏ qua (để dùng máy như bàn làm việc).
#
# ⚠️ Cố ý KHÔNG đặt `IdleAction`. Mặc định của logind là `ignore`, tức
#    logind KHÔNG tự ngủ khi bạn ngồi không chạm gì. Việc ngủ khi rảnh do
#    swayidle đảm nhiện (timeout 900s, xem swayidle.service) — chỉ ngủ
#    khi dùng pin. Nếu để IdleAction=suspend ở đây, logind sẽ ngủ máy
#    kể cả khi đang cắm sạc và vừa mới cắm, ngay cả khi có việc đang
#    chạy dài.
#
# Chi tiết: man logind.conf — HandleLidSwitch*, IdleAction*

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
