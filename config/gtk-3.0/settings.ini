# GTK 3 — theme tối + icon Papirus.
#
# `Adwaita-dark` đi kèm GTK nên không cần cài theme ngoài. Muốn Tokyo
# Night đậm hơn thì cài `tokyonight-gtk-theme` (AUR) rồi đổi tên ở đây.
# Con trỏ Bibata: cài `bibata-cursor` (AUR). Cả hai đều là TUỲ CHỌN —
# thiếu thì GTK/foot tự dùng mặc định, không hỏng gì.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-font-name=JetBrains Mono 11
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
