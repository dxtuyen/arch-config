# Tuỳ chọn engine Bamboo. Khoá khớp với BambooConfig trong
# src/bambooconfig.h của fcitx5-bamboo.
#
#   InputMethod  : Telex (kiểu gõ phổ biến nhất VN) | VNI | VNQ | VNIQ
#   SpellCheck   : tự động viết hoa + sửa lỗi chính tả sau khi gõ
#   Macro        : gõ tắt → tự mở rộng (ví dụ "vn" → "Việt Nam")
#   FreeMarking  : cho phép gõ dấu tự do (hợp với viết tay)

InputMethod=Telex
OutputCharset=Unicode
SpellCheck=True
Macro=True
AutoNonVnRestore=True
ModernStyle=False
FreeMarking=True
DisplayUnderline=True
