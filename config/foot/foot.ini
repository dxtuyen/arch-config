# ══════════════════════════════════════════════════════════════
#  Foot — terminal. Chọn vì hỗ trợ SIXEL → yazi hiện được ảnh THẬT
#  trong khung preview (kitty-graphics/sixel thì không có ở app khác).
#
#  ⚠️ Cú pháp màu trong foot — sai là foot in "err: config.c:..."
#     ngay khi mở cửa sổ mới. Kiểm tra KHÔNG cần mở cửa sổ:
#         foot -C
#    • Màu đơn: RRGGBB (6 hex, KHÔNG có dấu #).
#    • Màu CẶP (cursor, jump-labels, scrollback-indicator, search-box-*):
#      HAI màu hex CÁCH NHAU bởi KHOẢNG TRẮNG, thứ tự `chữ nền`.
#      KHÔNG dùng "/" làm dấu phân cách, KHÔNG dùng tên `regular0`.
# ══════════════════════════════════════════════════════════════

font=JetBrainsMono Nerd Font:size=11
pad=10x8
scrollback-lines=10000
mouse-hide-when-typing=yes

[cursor]
style=beam
blink=yes
blink-rate=550
beam-thickness=1.5

# ── Tokyo Night ─────────────────────────────────────────────
# CỐ Ý chỉ khai 16 màu ANSI + nền/fg/cursor. Bảng 256 màu (16–255)
# giữ mặc định của foot — y hệt config Alacritty cũ.
#
# Sway không có blur ⇒ "acrylic" không tồn tại; foot có khoá `blur`
# nhưng cần protocol `ext-background-effect-manager-v1` (chỉ KDE
# Plasma 6.1+) nên bị bỏ qua. Ở đây chỉ dùng trong suốt phẳng;
# muốn giống kính mờ thì dùng ảnh nền ĐÃ BLUR SẴN.

[colors-dark]
alpha=0.9
background=1a1b26
foreground=c0caf5
cursor=1a1b26 c0caf5
selection-foreground=c0caf5
selection-background=364a82

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=73daca
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=73daca
bright7=acb0d0

# Đều là cặp "chữ nền".
jump-labels=15161e e0af68
scrollback-indicator=15161e 7aa2f7
search-box-match=15161e e0af68
search-box-no-match=15161e f7768e
