# Biến môi trường cho systemd --user (và do đó cho mọi service user
# như swayidle, awww-daemon, fcitx5). GIỮ ĐỒNG BỘ với
# ~/.config/session-env.sh — sửa cả hai cùng lúc.
#
# Đổi xong:  systemctl --user daemon-reexec && systemctl --user restart <service>

QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
GDK_IM_MODULE=fcitx
QT_QPA_PLATFORMTHEME=gtk3
ELECTRON_OZONE_PLATFORM_HINT=auto
